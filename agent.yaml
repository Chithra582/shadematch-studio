spec_version: "0.1.0"
name: shadeswatch-studio
version: "1.0.0"
description: "Personalized beauty intelligence agent that matches cosmetic shades to skin tone, undertone, and style preferences using rule-based reasoning and curated mock data"
author: "Chithra"
license: "Apache-2.0"

model:
  preferred: "claude-3-7-sonnet"
  fallback:
    - "gpt-4o"
    - "gemini-2.5-pro"
  constraints:
    temperature: 0.2
    max_tokens: 4096
    top_p: 0.95

runtime:
  max_turns: 30
  timeout: 300
  temperature: 0.2

skills:
  - shade-matching
  - beauty-profile-generation
  - analytics-summarization

tools:
  - shade-recommender
  - profile-builder

compliance:
  risk_tier: standard
  frameworks:
    - standard_agentic_safety
  supervision:
    human_in_the_loop: conditional
    review_cadence: quarterly
